<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Portfólio de vídeos da Framez Agência. Sua marca sob outra perspectiva.">
<style>
  :root { color-scheme: light; }
  body { margin: 0; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
</style>
<title>Framez Agência</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  /* Layout: one quiet column under a fixed glass header; a field of blurred translucent light behind everything; slogan steps up in opacity; videos sit in glass frames; one floating WhatsApp pill. */
  :root {
    --bg: #eeeef1;
    --fg: #15151a;
    --muted: #6a6a76;
    --accent: #6d28f0;
    --glass: rgba(255, 255, 255, 0.55);
    --glass-head: rgba(247, 247, 250, 0.62);
    --edge: rgba(255, 255, 255, 0.9);
    --line: rgba(21, 21, 26, 0.09);
    --shadow: 0 30px 60px -30px rgba(30, 30, 55, 0.35);
    --orb-1: rgba(140, 140, 165, 0.34);
    --orb-2: rgba(255, 255, 255, 0.95);
    --orb-3: rgba(185, 185, 205, 0.4);
    --cta-bg: rgba(21, 21, 26, 0.9);
    --cta-fg: #fafafc;
    --cta-shadow: 0 18px 40px -14px rgba(21, 21, 26, 0.55);
    --slot-bg: rgba(21, 21, 26, 0.04);
    --slot-line: rgba(21, 21, 26, 0.24);
    --video-bg: #000;
    --btn-bg: rgba(21, 21, 26, 0.9);
    --btn-fg: #fafafc;
    --show-l: block;
    --show-d: none;
    --font-display: "Montserrat", "Helvetica Neue", Arial, sans-serif;
    --font-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #050507;
      --fg: #f3f2f8;
      --muted: #9a97a9;
      --accent: #9a52ff;
      --glass: rgba(255, 255, 255, 0.06);
      --glass-head: rgba(10, 8, 18, 0.5);
      --edge: rgba(255, 255, 255, 0.16);
      --line: rgba(255, 255, 255, 0.1);
      --shadow: 0 30px 70px -30px rgba(100, 40, 230, 0.55);
      --orb-1: rgba(124, 58, 237, 0.55);
      --orb-2: rgba(70, 25, 150, 0.6);
      --orb-3: rgba(168, 85, 247, 0.3);
      --cta-bg: linear-gradient(135deg, #8d42f8, #5a1bd0);
      --cta-fg: #ffffff;
      --cta-shadow: 0 18px 44px -12px rgba(124, 58, 237, 0.8);
      --slot-bg: rgba(255, 255, 255, 0.04);
      --slot-line: rgba(255, 255, 255, 0.24);
      --video-bg: #000;
      --btn-bg: linear-gradient(135deg, #8d42f8, #5a1bd0);
      --btn-fg: #ffffff;
      --show-l: none;
      --show-d: block;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #050507;
    --fg: #f3f2f8;
    --muted: #9a97a9;
    --accent: #9a52ff;
    --glass: rgba(255, 255, 255, 0.06);
    --glass-head: rgba(10, 8, 18, 0.5);
    --edge: rgba(255, 255, 255, 0.16);
    --line: rgba(255, 255, 255, 0.1);
    --shadow: 0 30px 70px -30px rgba(100, 40, 230, 0.55);
    --orb-1: rgba(124, 58, 237, 0.55);
    --orb-2: rgba(70, 25, 150, 0.6);
    --orb-3: rgba(168, 85, 247, 0.3);
    --cta-bg: linear-gradient(135deg, #8d42f8, #5a1bd0);
    --cta-fg: #ffffff;
    --cta-shadow: 0 18px 44px -12px rgba(124, 58, 237, 0.8);
    --slot-bg: rgba(255, 255, 255, 0.04);
    --slot-line: rgba(255, 255, 255, 0.24);
    --video-bg: #000;
    --btn-bg: linear-gradient(135deg, #8d42f8, #5a1bd0);
    --btn-fg: #ffffff;
    --show-l: none;
    --show-d: block;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.55;
    padding-block: 0;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    -webkit-font-smoothing: antialiased;
  }

  /* translucent light field */
  .field { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .orb { position: absolute; border-radius: 50%; filter: blur(70px); will-change: transform, opacity; }
  .o1 { width: 62vmax; height: 62vmax; left: -22vmax; top: -18vmax; background: radial-gradient(closest-side, var(--orb-1), transparent); animation: drift-a 26s ease-in-out infinite alternate; }
  .o2 { width: 54vmax; height: 54vmax; right: -20vmax; top: 18vh; background: radial-gradient(closest-side, var(--orb-2), transparent); animation: drift-b 32s ease-in-out infinite alternate; }
  .o3 { width: 48vmax; height: 48vmax; left: 8vw; bottom: -26vmax; background: radial-gradient(closest-side, var(--orb-3), transparent); animation: drift-c 38s ease-in-out infinite alternate; }
  @keyframes drift-a { from { transform: translate3d(0, 0, 0); opacity: 0.55; } to { transform: translate3d(6vmax, 5vmax, 0); opacity: 1; } }
  @keyframes drift-b { from { transform: translate3d(0, 0, 0); opacity: 1; } to { transform: translate3d(-7vmax, 4vmax, 0); opacity: 0.5; } }
  @keyframes drift-c { from { transform: translate3d(0, 0, 0); opacity: 0.6; } to { transform: translate3d(5vmax, -6vmax, 0); opacity: 1; } }

  /* fixed glass header */
  .top {
    position: fixed; top: 0; left: 0; right: 0; z-index: 20;
    height: calc(62px + env(safe-area-inset-top, 0px));
    padding-top: env(safe-area-inset-top, 0px);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; align-items: center; justify-content: center;
    background: var(--glass-head);
    -webkit-backdrop-filter: blur(24px) saturate(1.7);
    backdrop-filter: blur(24px) saturate(1.7);
    box-shadow: inset 0 -1px 0 var(--line), inset 0 1px 0 var(--edge);
  }
  .logo { height: 26px; width: auto; max-width: 100%; }
  .logo-l { display: var(--show-l); }
  .logo-d { display: var(--show-d); }

  .wrap { max-width: 880px; margin: 0 auto; padding-top: 112px; padding-bottom: 132px; display: flex; flex-direction: column; gap: 44px; }

  h1 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 800;
    font-size: clamp(1.8rem, 8.4vw, 4.4rem);
    line-height: 1.02;
    letter-spacing: 0.01em;
    text-transform: uppercase;
    text-wrap: balance;
  }
  h1 span { display: block; }
  .l1 { opacity: 0.36; }
  .l2 { opacity: 0.62; }
  .l3 { opacity: 1; }
  .l3 i { font-style: normal; color: var(--accent); }

  .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; padding-top: 22px; border-top: 1px solid var(--line); }
  .facts p { margin: 0; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .facts strong { font-family: var(--font-display); font-weight: 700; font-size: clamp(1.4rem, 5vw, 2rem); letter-spacing: -0.01em; line-height: 1.1; }
  .facts span { color: var(--muted); font-size: 0.95rem; max-width: 26ch; }

  #videos { display: flex; flex-direction: column; gap: 22px; }
  .vid {
    margin: 0; padding: 6px; border-radius: 26px;
    background: var(--glass);
    -webkit-backdrop-filter: blur(18px) saturate(1.5);
    backdrop-filter: blur(18px) saturate(1.5);
    box-shadow: inset 0 1px 0 var(--edge), inset 0 0 0 1px var(--line), var(--shadow);
  }
  .vid video { display: block; width: 100%; max-height: 78vh; aspect-ratio: 16 / 9; object-fit: contain; border-radius: 20px; background: var(--video-bg); }
  .vid .tools { display: flex; gap: 8px; padding: 10px 6px 4px; flex-wrap: wrap; }

  .slot {
    border-radius: 26px; aspect-ratio: 16 / 9; min-height: 160px;
    background: var(--slot-bg); box-shadow: inset 0 0 0 1.5px var(--slot-line);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 16px;
  }
  .slot b { font-family: var(--font-display); font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; font-size: 0.82rem; color: var(--muted); }
  .slot small { color: var(--muted); font-size: 0.82rem; }

  .btn {
    font: 600 0.88rem/1 var(--font-body); color: var(--btn-fg); background: var(--btn-bg);
    border: 0; border-radius: 999px; padding: 11px 18px; cursor: pointer;
  }
  .btn.ghost { background: var(--glass); color: var(--fg); box-shadow: inset 0 0 0 1px var(--line); }
  .btn:disabled { opacity: 0.5; cursor: default; }

  .admin {
    border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 12px;
    background: var(--glass); box-shadow: inset 0 0 0 1px var(--line);
  }
  .admin h2 { margin: 0; font-family: var(--font-display); font-size: 0.78rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .admin label { font-size: 0.9rem; font-weight: 600; }
  .admin .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .admin input[type="tel"] {
    flex: 1 1 200px; min-width: 0; font: 500 1rem var(--font-body); color: var(--fg); background: var(--slot-bg);
    border: 0; border-radius: 12px; padding: 11px 14px; box-shadow: inset 0 0 0 1px var(--line);
  }
  .admin p { margin: 0; font-size: 0.85rem; color: var(--muted); }
  #status { min-height: 1.3em; color: var(--fg); font-weight: 600; }

  /* floating WhatsApp pill */
  .dock {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; pointer-events: none;
    display: flex; justify-content: center;
    padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  }
  .cta {
    pointer-events: auto; display: inline-flex; align-items: center; justify-content: center; gap: 12px;
    min-height: 56px; padding: 0 30px; max-width: 100%; border-radius: 999px; text-decoration: none;
    font-family: var(--font-display); font-weight: 700; font-size: 1rem; letter-spacing: 0.01em;
    color: var(--cta-fg); background: var(--cta-bg);
    box-shadow: inset 0 1px 0 var(--edge), var(--cta-shadow);
    transition: transform 0.2s ease, filter 0.2s ease;
  }
  .cta:hover { transform: translateY(-2px); filter: brightness(1.08); }
  .cta svg { flex: none; width: 20px; height: 20px; }

  /* floating theme switch */
  .theme {
    position: fixed; z-index: 20;
    right: max(16px, env(safe-area-inset-right, 0px));
    bottom: calc(86px + env(safe-area-inset-bottom, 0px));
    width: 48px; height: 48px; border-radius: 50%; border: 0; padding: 0; cursor: pointer;
    display: grid; place-items: center; color: var(--fg);
    background: var(--glass-head);
    -webkit-backdrop-filter: blur(20px) saturate(1.6);
    backdrop-filter: blur(20px) saturate(1.6);
    box-shadow: inset 0 1px 0 var(--edge), inset 0 0 0 1px var(--line), var(--shadow);
    transition: transform 0.2s ease;
  }
  .theme:hover { transform: scale(1.07); }
  .theme svg { width: 21px; height: 21px; }
  .ico-moon { display: var(--show-l); }
  .ico-sun { display: var(--show-d); }

  a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  @media (max-width: 520px) {
    .facts { grid-template-columns: 1fr; gap: 18px; }
    .wrap { gap: 36px; padding-top: 104px; }
    .cta { width: 100%; }
  }
  @media (prefers-reduced-motion: reduce) {
    .orb { animation: none; }
    .cta, .theme { transition: none; }
  }
</style>
</head>

    try { localStorage.setItem("framez-theme", n); } catch (e) {}
    label();
  });
})();
</script>
